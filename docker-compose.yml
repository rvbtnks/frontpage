services:
  frontpage:
    build: .
    container_name: frontpage
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - LINKWARDEN_HOST=${LINKWARDEN_HOST:-http://localhost:3000}
      - LINKWARDEN_TOKEN=${LINKWARDEN_TOKEN:-}
      - LINKWARDEN_COLLECTION_ID=${LINKWARDEN_COLLECTION_ID:-}
      - LINKWARDEN_LIMIT=${LINKWARDEN_LIMIT:-10}
      - RSS=${RSS:-https://hnrss.org/frontpage?count=20}
    restart: unless-stopped
